# Build and test on iOS 17. No extra dependencies.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -scheme RhythmTap \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            build

      - name: Run unit tests
        run: |
          xcodebuild -scheme RhythmTap \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            -only-testing:RhythmTapTests \
            test

      - name: Run UI tests
        run: |
          xcodebuild -scheme RhythmTap \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            -only-testing:RhythmTapUITests \
            test
        continue-on-error: true
